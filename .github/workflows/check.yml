name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/check.sh
      - name: Validate packaging
        env:
          JARVIS_SIGNING_IDENTITY: '-'
        run: |
          ./scripts/package-macos.sh
          JARVIS_REQUIRE_PERSONAL_SIGNATURE=1 JARVIS_REQUIRE_UPDATER_CONFIGURATION=1 ./scripts/validate-installed-app.sh
          JARVIS_RELEASE_MODE=personal ./scripts/make-release-artifacts.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts='--all' --redact=100
