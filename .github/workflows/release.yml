name: Release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.2.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: jarvis-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      JARVIS_RELEASE_MODE: ${{ vars.JARVIS_RELEASE_MODE || 'personal' }}
      JARVIS_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
      APPLE_SIGNING_PASSWORD: ${{ secrets.APPLE_SIGNING_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'Missing SPARKLE_PRIVATE_KEY'; exit 1; }
          case "$JARVIS_RELEASE_MODE" in
            personal)
              echo 'JARVIS_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
              ;;
            developer-id)
              for name in JARVIS_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_SIGNING_CERTIFICATE APPLE_SIGNING_PASSWORD APPLE_ID APPLE_APP_PASSWORD; do
                [[ -n "${!name}" ]] || { echo "Missing release setting: $name"; exit 1; }
              done
              [[ "$JARVIS_SIGNING_IDENTITY" == 'Developer ID Application:'* ]] || { echo 'A Developer ID Application identity is required'; exit 1; }
              ;;
            *)
              echo 'JARVIS_RELEASE_MODE must be personal or developer-id'
              exit 1
              ;;
          esac
          echo "JARVIS_MARKETING_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "JARVIS_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Import signing certificate
        if: env.JARVIS_RELEASE_MODE == 'developer-id'
        shell: bash
        run: |
          umask 077
          certificate="$RUNNER_TEMP/jarvis-signing.p12"
          keychain="$RUNNER_TEMP/jarvis-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_SIGNING_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$certificate"
      - name: Test
        run: ./scripts/check.sh
      - name: Package and validate app
        run: |
          ./scripts/package-macos.sh
          if [[ "$JARVIS_RELEASE_MODE" == personal ]]; then
            JARVIS_REQUIRE_PERSONAL_SIGNATURE=1 JARVIS_REQUIRE_UPDATER_CONFIGURATION=1 ./scripts/validate-installed-app.sh
          else
            JARVIS_REQUIRE_DISTRIBUTION_SIGNATURE=1 JARVIS_REQUIRE_UPDATER_CONFIGURATION=1 ./scripts/validate-installed-app.sh
          fi
      - name: Create personal release archives
        if: env.JARVIS_RELEASE_MODE == 'personal'
        run: ./scripts/make-release-artifacts.sh
      - name: Notarize and staple
        if: env.JARVIS_RELEASE_MODE == 'developer-id'
        shell: bash
        run: |
          xcrun notarytool store-credentials JARVIS_RELEASE --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          JARVIS_NOTARY_PROFILE=JARVIS_RELEASE ./scripts/notarize-macos.sh --submit
      - name: Sign update feed
        shell: bash
        run: |
          updates="$RUNNER_TEMP/jarvis-updates"
          mkdir -p "$updates"
          cp dist/J.A.R.V.I.S-macos-arm64.zip "$updates/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | apps/macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - --maximum-deltas 0 --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" "$updates"
          cp "$updates/appcast.xml" dist/appcast.xml
          test -s dist/appcast.xml
          ./scripts/validate-update-feed.py dist/appcast.xml dist/J.A.R.V.I.S-macos-arm64.zip
      - name: Publish release
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-signing-notes.md"
          if [[ "$JARVIS_RELEASE_MODE" == personal ]]; then
            cat > "$notes" <<'NOTES'
          This is a personal build with an ad hoc code signature. It is not Apple notarized. Sparkle verifies update archives and the feed using Jarvis's Ed25519 update key.

          Install the first updater-enabled build in Applications. If macOS blocks it, try opening it, then use System Settings → Privacy & Security → Open Anyway. See [Apple's instructions](https://support.apple.com/en-us/102445) and [Jarvis's update guide](https://github.com/aoppenh1-afk/Siri-2.0/blob/main/docs/updates.md). macOS may request microphone or Keychain access again after updates.
          NOTES
          else
            printf 'This build is Developer ID signed and Apple notarized.\n' > "$notes"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            [[ "$(cat "$RUNNER_TEMP/release-state")" == true ]] || { echo 'A published release already exists; create a new version'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "J.A.R.V.I.S. ${RELEASE_TAG#v}" --generate-notes --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" dist/J.A.R.V.I.S-macos-arm64.zip dist/J.A.R.V.I.S-macos-arm64.dmg dist/appcast.xml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Remove signing keychain
        if: always() && env.JARVIS_RELEASE_MODE == 'developer-id'
        run: |
          security delete-keychain "$RUNNER_TEMP/jarvis-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/jarvis-signing.p12"
