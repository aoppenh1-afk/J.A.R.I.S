<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Glass Voice Orb</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    #siri-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      opacity: 0;
      transition: opacity 120ms ease-out;
    }

    #siri-reply {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(500px, calc(100% - 72px));
      max-height: calc(100% - 52px);
      padding: 4px 2px;
      transform: translate(-50%, -50%) scale(.97);
      color: rgba(255,255,255,.94);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
      text-align: center;
      text-wrap: pretty;
      overflow-wrap: anywhere;
      word-break: normal;
      white-space: normal;
      text-shadow: 0 1px 8px rgba(0,0,0,.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 280ms cubic-bezier(.2,.8,.2,1);
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #siri-reply[data-length="long"] {
      font-size: 13px;
      line-height: 1.36;
      -webkit-line-clamp: 7;
    }

    #siri-reply[data-length="very-long"] {
      font-size: 12px;
      line-height: 1.34;
      -webkit-line-clamp: 8;
    }

    html[data-mode="dialog"] #siri-reply {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    html[data-ready="true"] #siri-canvas { opacity: 1; }
  </style>
  <script>
    window.SIRI_DEFAULT_BG = "./assets/96bdad248714663.69fdafdc31e48.webp";
    window.SIRI_PARAMS = {};
  </script>
</head>
<body>
  <canvas id="siri-canvas" aria-hidden="true"></canvas>
  <div id="siri-reply" role="status" aria-live="polite"></div>
  <script src="./src/pipeline.js"></script>
  <script src="./src/shaders.js"></script>
  <script src="./shader-sources.js"></script>
  <script src="./src/uniforms.js"></script>
  <script src="./src/renderer.js"></script>
  <script src="./src/state.js"></script>
  <script src="./bridge.js"></script>
</body>
</html>
